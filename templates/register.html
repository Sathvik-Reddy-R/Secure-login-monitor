<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f6f9;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .container{

            width:450px;

            background:white;

            padding:35px;

            border-radius:12px;

            box-shadow:0 0 20px rgba(0,0,0,0.1);
        }

        h2{

            text-align:center;

            margin-bottom:25px;

            color:#333;
        }

        .input-group{

            margin-bottom:15px;
        }

        .input-group label{

            display:block;

            margin-bottom:6px;

            color:#555;
        }

        .input-group input{

            width:100%;

            padding:12px;

            border:1px solid #ccc;

            border-radius:6px;

            outline:none;
        }

        .input-group input:focus{

            border-color:#007bff;
        }

        button{

            width:100%;

            padding:12px;

            border:none;

            border-radius:6px;

            background:#28a745;

            color:white;

            font-size:16px;

            cursor:pointer;
        }

        button:hover{

            background:#218838;
        }

        .message{

            text-align:center;

            margin-bottom:15px;

            color:red;
        }

        .links{

            text-align:center;

            margin-top:15px;
        }

        .links a{

            text-decoration:none;

            color:#007bff;
        }

        .links a:hover{

            text-decoration:underline;
        }

        .security{

            text-align:center;

            margin-top:20px;

            color:green;

            font-size:14px;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Create Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="input-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                required>

        </div>

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                required>

        </div>

        <div class="input-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                minlength="8"
                required>

        </div>

        <button type="submit">

            Register

        </button>

    </form>

    <div class="links">

        Already have an account?

        <a href="/login">

            Login

        </a>

    </div>

    <div class="security">

        🔒 Account protected by Secure Login Monitor

    </div>

</div>

</body>
</html>
